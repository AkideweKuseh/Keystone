name: keystone

# Usage (from repo root):
#   docker compose -f infra/compose/docker-compose.prod.yml --env-file .env.production up --build -d
#
# First run: migrations are applied automatically by the migrate service.
# To run the seed after first deploy:
#   docker compose -f infra/compose/docker-compose.prod.yml exec api node node_modules/.bin/ts-node prisma/seed.ts
# (or run the seed from your local machine pointing at the VPS DB)

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [keystone]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [keystone]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [keystone]

  # ── One-shot migration ───────────────────────────────────────────────────────

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.migrate
    restart: on-failure
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [keystone]

  # ── Application services ─────────────────────────────────────────────────────

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - '${API_PORT:-4001}:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      DEVICE_SECRET_KEY: ${DEVICE_SECRET_KEY}
      SYNC_CONCURRENCY: ${SYNC_CONCURRENCY:-10}
      DEVICE_REQUEST_TIMEOUT_MS: ${DEVICE_REQUEST_TIMEOUT_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [keystone]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DEVICE_SECRET_KEY: ${DEVICE_SECRET_KEY}
      SYNC_CONCURRENCY: ${SYNC_CONCURRENCY:-10}
      SYNC_MAX_RETRIES: ${SYNC_MAX_RETRIES:-8}
      SYNC_BACKOFF_MS: ${SYNC_BACKOFF_MS:-5000}
      DEVICE_REQUEST_TIMEOUT_MS: ${DEVICE_REQUEST_TIMEOUT_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [keystone]

  receiver:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.receiver
    restart: unless-stopped
    ports:
      - '${RECEIVER_PORT:-4002}:3001'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [keystone]

  dashboard:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - '${DASHBOARD_PORT:-3002}:80'
    depends_on:
      api:
        condition: service_healthy
    networks: [keystone]

# ── Volumes & network ────────────────────────────────────────────────────────

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  keystone:
    driver: bridge
